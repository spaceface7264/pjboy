name: Deploy to GitHub Pages

on:
  # Runs on pushes to the main branch
  push:
    branches: [ main ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Create build directory
        run: mkdir -p _site
        
      - name: Copy project files
        run: |
          # Copy main files
          cp index.html _site/
          cp game.js _site/
          cp style.css _site/
          cp README.md _site/
          cp instructions.txt _site/
          
          # Copy 3D assets
          cp *.glb _site/ 2>/dev/null || true
          cp *.gltf _site/ 2>/dev/null || true
          cp *.bin _site/ 2>/dev/null || true
          
          # Copy any additional assets
          cp -r inmaze _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true
          
      - name: Optimize assets
        run: |
          # Check for large files and warn
          echo "Checking file sizes..."
          find _site -type f -size +10M -exec echo "Warning: Large file found: {}" \;
          
          # Create a simple index redirect if needed
          if [ ! -f _site/index.html ]; then
            echo "Error: index.html not found!"
            exit 1
          fi
          
      - name: Validate HTML
        run: |
          echo "Validating HTML structure..."
          if [ -f _site/index.html ]; then
            # Basic HTML validation
            grep -q "<!DOCTYPE html>" _site/index.html || echo "Warning: Missing DOCTYPE"
            grep -q "<title>" _site/index.html || echo "Warning: Missing title"
            grep -q "</html>" _site/index.html || echo "Warning: Missing closing html tag"
            grep -q "three.min.js" _site/index.html || echo "Warning: Three.js not found"
            echo "HTML validation completed"
          fi
          
      - name: Create .nojekyll file
        run: |
          # Create .nojekyll to bypass Jekyll processing
          touch _site/.nojekyll
          echo "Created .nojekyll file"
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Post-deployment verification
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for deployment
        run: sleep 30
        
      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          # Get the deployment URL
          DEPLOY_URL="${{ needs.deploy.outputs.page_url }}"
          echo "Deployment URL: $DEPLOY_URL"
          
          # Basic verification (optional)
          if command -v curl >/dev/null 2>&1; then
            echo "Checking if site is accessible..."
            curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL" || echo "Site verification failed"
          fi
          
      - name: Deployment Summary
        run: |
          echo "## 🎮 PJBoy Game Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Game URL:** ${{ needs.deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Features Deployed:**" >> $GITHUB_STEP_SUMMARY
          echo "- 3D Second-Person Maze Game" >> $GITHUB_STEP_SUMMARY
          echo "- Multiple Game Modes (Play/Create)" >> $GITHUB_STEP_SUMMARY
          echo "- 128-bit Retro Aesthetic" >> $GITHUB_STEP_SUMMARY
          echo "- Multiple Themes and Control Schemes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets Included:**" >> $GITHUB_STEP_SUMMARY
          echo "- 3D Models (.glb, .gltf, .bin)" >> $GITHUB_STEP_SUMMARY
          echo "- Game Logic (game.js)" >> $GITHUB_STEP_SUMMARY
          echo "- Styling (style.css)" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation (README.md)" >> $GITHUB_STEP_SUMMARY
