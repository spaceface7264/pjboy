name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci
        fi
        
    - name: Lint code
      run: |
        # Check for common JavaScript issues
        if [ -f game.js ]; then
          echo "Checking game.js for syntax errors..."
          node -c game.js
        fi
        
        if [ -f labyrinth\ 1.0.js ]; then
          echo "Checking labyrinth 1.0.js for syntax errors..."
          node -c "labyrinth 1.0.js"
        fi
        
    - name: Validate HTML
      run: |
        if [ -f index.html ]; then
          echo "Validating HTML structure..."
          # Basic HTML validation
          grep -q "<!DOCTYPE html>" index.html || echo "Warning: Missing DOCTYPE"
          grep -q "<title>" index.html || echo "Warning: Missing title"
          grep -q "</html>" index.html || echo "Warning: Missing closing html tag"
        fi
        
    - name: Check file sizes
      run: |
        echo "Checking for large files..."
        find . -name "*.glb" -o -name "*.bin" -o -name "*.gltf" | while read file; do
          size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
          if [ "$size" -gt 10485760 ]; then
            echo "Warning: $file is larger than 10MB ($size bytes)"
          fi
        done

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Create build directory
      run: mkdir -p dist
      
    - name: Copy project files
      run: |
        cp index.html dist/
        cp game.js dist/
        cp style.css dist/
        cp *.glb dist/ 2>/dev/null || true
        cp *.gltf dist/ 2>/dev/null || true
        cp *.bin dist/ 2>/dev/null || true
        cp instructions.txt dist/ 2>/dev/null || true
        cp README.md dist/
        
    - name: Create deployment package
      run: |
        cd dist
        tar -czf ../pjboy-build.tar.gz .
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pjboy-build
        path: pjboy-build.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: pjboy-build
        
    - name: Extract build
      run: tar -xzf pjboy-build.tar.gz
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        cname: # Add your custom domain here if you have one
