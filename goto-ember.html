<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel to Ember…</title>
  <style>body{background:#120806;color:#ffb27a;font:16px/1.5 system-ui;display:grid;place-items:center;height:100vh;margin:0}</style>
  <!-- AsteroidProfile is self-contained (guards its optional deps), so loading it alone is enough. -->
  <script src="asteroid-profile.js"></script>
</head>
<body>
  <div id="msg">Charting a course to <b>Ember</b>…</div>
  <script>
    (function () {
      var out = document.getElementById('msg');
      try {
        var AP = window.AsteroidProfile;
        if (!AP) { out.textContent = 'AsteroidProfile failed to load.'; return; }
        var p = AP.load();
        AP.grantPlanet(p, 'ember_glod');        // unlock Ember (non-destructive)
        AP.setCurrentPlanet(p, 'ember_glod');   // make it the active world (also saves)
        AP.save(p);
        out.innerHTML = 'Ember is set as your current world. Loading the game…';
        setTimeout(function () { location.replace('/'); }, 700);
      } catch (e) {
        out.textContent = 'Error: ' + e.message;
      }
    })();
  </script>
</body>
</html>
